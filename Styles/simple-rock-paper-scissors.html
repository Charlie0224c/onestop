<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RPS</title>
  </head>
  <body>
    <p>Rock Paper Scissors</p>
    <button
      onclick="
        if (randomNumber >= 0 && randomNumber < 1 / 3) {
          computerMove = 'Rock';
        } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
          computerMove = 'Paper';
        } else {
          computerMove = 'Scissors';
        }

        result = '';
        if (computerMove === 'Rock') {
          result = 'It\'s a tie!';
        } else if (computerMove === 'Paper') {
          result = 'You lose!';
        } else {
          result = 'You win!';
        }
        alert(
          `You picked Rock. The computer picked ${computerMove}. ${result}`,
        );
      "
    >
      Rock</button
    ><button
      onclick="
        if (randomNumber >= 0 && randomNumber < 1 / 3) {
          computerMove = 'Rock';
        } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
          computerMove = 'Paper';
        } else {
          computerMove = 'Scissors';
        }

        result = '';
        if (computerMove === 'Paper') {
          result = 'It\'s a tie!';
        } else if (computerMove === 'Scissors') {
          result = 'You lose!';
        } else {
          result = 'You win!';
        }
        alert(
          `You picked Paper. The computer picked ${computerMove}. ${result}`,
        );
      "
    >
      Paper</button
    ><button
      onclick="
        if (randomNumber >= 0 && randomNumber < 1 / 3) {
          computerMove = 'Rock';
        } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
          computerMove = 'Paper';
        } else {
          computerMove = 'Scissors';
        }

        result = '';
        if (computerMove === 'Scissors') {
          result = 'It\'s a tie!';
        } else if (computerMove === 'Rock') {
          result = 'You lose!';
        } else {
          result = 'You win!';
        }
        alert(
          `You picked Scissors. The computer picked ${computerMove}. ${result}`,
        );
      "
    >
      Scissors
    </button>
    <script>
      const randomNumber = Math.random();
      let computerMove = "";
    </script>
  </body>
</html>
